<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
  <!-- Map pattern for the "Swords Mistlands" alt biome: one repeating tile drawn over
       every cell of its sectors (256-unit tile: spread 2 in biomePatterns.ts).
       One motif (#m, base at 6.2,19.6) is drawn once and placed by <use>, so
       all are the same size; edit #m to change them all (each <use> adds its own
       tilt/mirror). Shapes stay inside the tile, since it repeats edge to edge.
       First pass from a layout script; move the <use>s freely. -->
  <defs>
    <g id="m">
      <path d="M5 8 H7.4 L7.1 19 H5.3 Z" fill="#c4562a" stroke="#1d1712" stroke-width="0.6" stroke-linejoin="round"/>
      <path d="M5 8 H5.9 L5.8 19 H5.3 Z" fill="#e3804b"/>
      <path d="M2.2 7 C3.6 7.5 8.8 7.5 10.2 7 L10.4 8.2 C8.8 8.8 3.6 8.8 2 8.2 Z" fill="#a8441f" stroke="#1d1712" stroke-width="0.6" stroke-linejoin="round"/>
      <path d="M5.6 3.6 H6.8 V7.2 H5.6 Z" fill="#7a2f14" stroke="#1d1712" stroke-width="0.6" stroke-linejoin="round"/>
      <path d="M5.6 1 H6.8 L7.6 1.8 V3 L6.8 3.8 H5.6 L4.8 3 V1.8 Z" fill="#d06a35" stroke="#1d1712" stroke-width="0.6" stroke-linejoin="round"/>
      <path d="M2.8 19.6 C4 18.6 8.4 18.6 9.6 19.6 C8.4 20.4 4 20.4 2.8 19.6 Z" fill="#2a2a30"/>
    </g>
  </defs>

  <use xlink:href="#m" transform="translate(218.0 65.0) scale(1.4) rotate(5 6.2 19.6)"/>
  <use xlink:href="#m" transform="translate(11.8 91.8) scale(1.4) translate(12.4 0) scale(-1 1) rotate(3 6.2 19.6)"/>
  <use xlink:href="#m" transform="translate(124.2 185.2) scale(1.4) translate(12.4 0) scale(-1 1) rotate(4 6.2 19.6)"/>
</svg>
