<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="128" height="128" viewBox="0 0 128 128">
  <!-- Map pattern for the "Mushroom" alt biome: one repeating tile, drawn over
       every cell of a Mushroom sector. Styled after the in-game Mushroom icon:
       a wide, low, muted-red cap with darker mottling and a dark underside,
       on a short, thick, grey stem.
       One mushroom (#m) is drawn once and placed by <use>, so all are the same
       size; edit #m to change them all (each <use> adds its own tilt/mirror). Clusters stay inside the tile with a
       margin, since the tile repeats edge to edge. -->
  <defs>
    <g id="m">
      <!-- stem: short, thick, bluish grey -->
      <path d="M4.3 6.4 C4.1 8.5 3.9 9.8 3.3 11.1 C4.6 11.8 7.4 11.8 8.7 11.1 C8.1 9.8 7.9 8.5 7.7 6.4 Z"
            fill="#6f7180" stroke="#1e1c22" stroke-width="0.6"/>
      <!-- stem shade -->
      <path d="M6.7 6.8 C6.9 8.7 7.2 10 7.8 11.2 C8.2 11.1 8.5 11 8.6 10.9 C8.1 9.8 7.9 8.5 7.7 6.6 Z" fill="#4e4f5c"/>
      <!-- tan patch on the stem -->
      <path d="M4.6 8.6 C5.2 8.3 6 8.5 6 9.2 C5.6 9.8 4.7 9.8 4.4 9.3 Z" fill="#b48c64"/>
      <!-- cap underside shadow -->
      <path d="M0.6 6.4 C3 8 9.4 8 11.8 6.2 C9.4 7.4 3 7.5 0.6 6.4 Z" fill="#331412"/>
      <!-- cap: wide and low -->
      <path d="M0 6.3 C0.3 3.7 2.9 2.1 6.2 2.1 C9.6 2.1 12 3.5 12.3 5.9 C9 7.3 3.4 7.4 0 6.3 Z"
            fill="#9c3429" stroke="#241210" stroke-width="0.7"/>
      <!-- lit top face -->
      <path d="M1.4 4.6 C2.6 3.2 4.4 2.6 6.2 2.6 C8.6 2.6 10.4 3.3 11.3 4.4 C9 4.1 4.2 4.2 1.4 4.6 Z" fill="#c04a3c"/>
      <!-- darker lower rim -->
      <path d="M0.5 6.1 C3.6 6.9 8.6 6.9 11.8 5.8 C11.7 5.4 11.6 5.1 11.4 4.8 C8.8 5.8 3.4 5.9 0.8 5.2 C0.6 5.5 0.5 5.8 0.5 6.1 Z" fill="#7a261d"/>
      <!-- mottling -->
      <path d="M3.4 3.9 C4 3.7 4.6 4 4.3 4.5 C3.8 4.7 3.2 4.4 3.4 3.9 Z
               M8 3.6 C8.6 3.6 8.9 4.1 8.4 4.4 C7.9 4.5 7.6 4 8 3.6 Z
               M5.9 5 C6.5 4.9 6.8 5.4 6.3 5.6 C5.8 5.7 5.5 5.3 5.9 5 Z"
            fill="#7a2820"/>
    </g>
  </defs>

  <!-- Clusters of 1-3 at uneven spots, each mushroom with its own tilt and
       about half mirrored, so the repeat doesn't read as a grid. Within a
       cluster, back row first. -->
  <!-- three, upper left -->
  <use xlink:href="#m" transform="translate(34 6) translate(12 0) scale(-1 1) rotate(8 6 7)"/>
  <use xlink:href="#m" transform="translate(21 9) rotate(-12 6 7)"/>
  <use xlink:href="#m" transform="translate(27 18) translate(12 0) scale(-1 1) rotate(-2 6 7)"/>
  <!-- two, upper right -->
  <use xlink:href="#m" transform="translate(86 16) rotate(12 6 7)"/>
  <use xlink:href="#m" transform="translate(92 25) translate(12 0) scale(-1 1) rotate(-6 6 7)"/>
  <!-- three, lower middle -->
  <use xlink:href="#m" transform="translate(72 70) translate(12 0) scale(-1 1) rotate(-8 6 7)"/>
  <use xlink:href="#m" transform="translate(62 76) rotate(10 6 7)"/>
  <use xlink:href="#m" transform="translate(74 82) rotate(-14 6 7)"/>
  <!-- one, lower left -->
  <use xlink:href="#m" transform="translate(10 88) translate(12 0) scale(-1 1) rotate(4 6 7)"/>
</svg>
