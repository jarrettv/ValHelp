<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
  <!-- Map pattern for the "Trees Mistlands" alt biome: one repeating tile drawn over
       every cell of its sectors (256-unit tile: spread 2 in biomePatterns.ts).
       One motif (#m, base at 7.4,20) is drawn once and placed by <use>, so
       all are the same size; edit #m to change them all (each <use> adds its own
       tilt/mirror). Shapes stay inside the tile, since it repeats edge to edge.
       First pass from a layout script; move the <use>s freely. -->
  <defs>
    <g id="m">
      <path d="M6.4 20 C6.8 16 6.2 13 7.4 10.4 C8 9 7.2 7.6 7.8 6 H9.2 C8.8 7.8 9.6 9.2 9 10.8 C8 13.4 8.6 16.4 8.2 20 Z" fill="#d8d4cc" stroke="#1d1712" stroke-width="0.6" stroke-linejoin="round"/>
      <path d="M8 1 C11.2 0.6 13.6 2.6 13.4 5.2 C14.4 7 13 9 10.8 8.8 C9.6 10 6.6 10 5.6 8.6 C3.2 9 1.8 7 2.8 5.2 C2.4 2.8 4.8 1 8 1 Z" fill="#c48ad0" stroke="#1d1712" stroke-width="0.6" stroke-linejoin="round"/>
      <path d="M10 1.6 C12.4 2 13.4 3.8 13 5.6 C13.8 7.2 12.6 8.6 10.8 8.4 C11.8 6.4 11.6 3.6 10 1.6 Z" fill="#a46cb4"/>
      <path d="M4.4 4.2 C5 3 6.4 2.2 8 2.2" stroke="#e4c2ea" stroke-width="0.6" stroke-linecap="round" fill="none"/>
    </g>
  </defs>

  <use xlink:href="#m" transform="translate(216.0 17.1) scale(1.3) translate(14.8 0) scale(-1 1) rotate(5 7.4 20)"/>
  <use xlink:href="#m" transform="translate(9.0 21.4) scale(1.3) translate(14.8 0) scale(-1 1) rotate(-3 7.4 20)"/>
  <use xlink:href="#m" transform="translate(199.3 25.0) scale(1.3) rotate(-1 7.4 20)"/>
  <use xlink:href="#m" transform="translate(150.5 96.0) scale(1.3) rotate(5 7.4 20)"/>
  <use xlink:href="#m" transform="translate(207.3 216.5) scale(1.3) rotate(2 7.4 20)"/>
</svg>
