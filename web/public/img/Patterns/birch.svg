<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="128" height="128" viewBox="0 0 128 128">
  <!-- Map pattern for the "Birch Meadows" alt biome: one repeating tile drawn over
       every cell of its sectors (128-unit tile: spread 1 in biomePatterns.ts).
       One motif (#m, base at 6,22) is drawn once and placed by <use>, so
       all are the same size; edit #m to change them all (each <use> adds its own
       tilt/mirror). Shapes stay inside the tile, since it repeats edge to edge.
       First pass from a layout script; move the <use>s freely. -->
  <defs>
    <g id="m">
      <path d="M5.2 22 C5.4 17 5.4 12 5.2 8 H6.8 C6.6 12 6.6 17 6.8 22 Z" fill="#ecebe4" stroke="#1d1712" stroke-width="0.6" stroke-linejoin="round"/>
      <path d="M5.4 12 H6.2 M5.8 15.4 H6.6 M5.4 18.6 H6.4 M5.6 9.6 H6.4" stroke="#2a2a2a" stroke-width="0.6"/>
      <path d="M6 1 C9.4 1.4 11.6 4.4 11.2 7.6 C10.8 10.4 8.6 11.6 6 11.4 C3.4 11.6 1.2 10.4 0.8 7.6 C0.4 4.4 2.6 1.4 6 1 Z" fill="#9bc45a" stroke="#1d1712" stroke-width="0.6" stroke-linejoin="round"/>
      <path d="M8 2 C10 3 11 5.2 10.8 7.4 C10.2 9.6 8.8 10.8 7 11.2 C9 9 9.4 5.6 8 2 Z" fill="#7aa544"/>
    </g>
  </defs>

  <use xlink:href="#m" transform="translate(76.3 33.8) scale(1.0) rotate(-10 6 22)"/>
  <use xlink:href="#m" transform="translate(25.6 69.4) scale(1.0) rotate(6 6 22)"/>
  <use xlink:href="#m" transform="translate(103.7 91.8) scale(1.0) translate(12 0) scale(-1 1) rotate(3 6 22)"/>
  <use xlink:href="#m" transform="translate(94.0 99.9) scale(1.0) rotate(7 6 22)"/>
</svg>
