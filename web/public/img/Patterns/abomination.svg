  <!-- Map pattern for the "Bog Swamp" and "Abomination Swamp" alt biomes: one
       repeating tile, drawn over every cell of those sectors. Very sparse: a
       256-unit tile (spread 2 in biomePatterns.ts).
       #a is the abomination POI icon (Poi/abomtrunk.svg) at 2.6x, base
       at about 22,40. It's a copy, because the map loads this file as an
       image and images can't pull shapes from another file; keep the two in
       step by hand. Each <use> adds its own tilt/mirror. Keep trunks inside
       the tile with a margin, since it repeats edge to edge. -->
  <defs
     id="defs865">
    <g
       id="a"
       transform="scale(2.6)">
      <!-- ground mound -->
      <path
         d="M0.9 15.7 C1.8 14.3 5 13.7 8.47 13.7 C11.9 13.7 15.1 14.3 16 15.7 C14.8 16.6 2.1 16.6 0.9 15.7 Z"
         fill="#2c2a1f"
         id="path844" />
      <!-- dead twigs (behind the body) -->
      <path
         d="M5.2 8.8 C4.6 7.6 4 6.6 3.2 5.4 M4.2 7.2 C3.6 7 3 7 2.5 7.3"
         stroke="#241c14"
         stroke-width="0.45"
         stroke-linecap="round"
         fill="none"
         id="path846" />
      <path
         d="M12.4 12.2 C13.4 11.6 14.2 11.6 14.9 11.9 C15.4 12.1 15.8 12 16.3 11.6"
         stroke="#241c14"
         stroke-width="0.5"
         stroke-linecap="round"
         fill="none"
         id="path848" />
      <!-- body silhouette: wide at the ground, a broad two-lobed bulge on top -->
      <path
         d="M2.2 15.1 C3 13.2 4.2 12 4.8 10.4 C4.5 8.2 4.3 5.8 5.2 3.9 C6 2.2 7.8 1.8 8.5 2.9 C9.2 1.9 11.2 2 12 3.8 C12.8 5.6 12.4 7.9 11.9 9.7 C12.8 11.4 13.9 12.9 14.8 15.1 C10.6 15.8 6.4 15.8 2.2 15.1 Z"
         fill="#24401d"
         stroke="#141c10"
         stroke-width="0.5"
         stroke-linejoin="round"
         id="path850" />
      <!-- twisted strands -->
      <!-- left strand: from the ground up to the top left -->
      <path
         d="M3.6 14.9 C4.8 12.4 5.6 10 5.6 7.4 C5.5 5.4 5.9 3.6 7.3 2.7 C8.2 3.4 8.3 4.6 7.9 6 C7.4 8.8 6.2 12 5.4 15.1 Z"
         fill="#3f7a2f"
         id="path852" />
      <!-- right strand: from the ground on the right, crossing up to the top -->
      <path
         d="M13.4 15 C12.2 12.6 10.9 10.6 10.6 8.2 C10.4 6.2 9.8 4.2 9 2.8 C10.6 2.4 11.7 3.4 11.9 5.2 C12.1 7.4 11.7 9.8 12.4 11.8 C12.8 12.8 13.6 13.8 14 15 Z"
         fill="#4a8634"
         id="path854" />
      <!-- front strand: wrapping diagonally across the middle -->
      <path
         d="M5.6 12.8 C6.6 10.6 8.2 8.6 10.4 6.8 C11 6.4 11.4 6.6 11.3 7.3 C9.8 9 8.4 11 7.6 13.4 C7 13.6 6.2 13.4 5.6 12.8 Z"
         fill="#56963c"
         id="path856" />
      <!-- crevices between strands -->
      <path
         d="M8.5 3.1 C8.8 4.2 8.9 5.4 8.7 6.8 M7.9 9.4 C8.6 8.6 9.4 7.8 10.2 7.1 M8.2 12.4 C8.8 11.4 9.4 10.6 10.2 9.6 M10.2 10.4 C10.6 12 11.2 13.4 11.6 14.8"
         stroke="#121a0e"
         stroke-width="0.4"
         stroke-linecap="round"
         fill="none"
         id="path858" />
      <!-- brown bark streaks -->
      <path
         d="M5 11.2 C5.3 10.4 5.5 9.6 5.6 8.6 M11.8 10.4 C12.2 11.4 12.8 12.4 13.2 13.4 M6.2 3.6 C5.9 4.2 5.8 4.8 5.8 5.4"
         stroke="#7a6034"
         stroke-width="0.5"
         stroke-linecap="round"
         fill="none"
         id="path860" />
      <!-- moss highlights -->
      <path
         d="M7 4.4 C7.1 5 7.1 5.6 7 6.2 M10.2 3.4 C10.7 3.9 11 4.6 11.1 5.3 M7.4 10.4 C8 9.6 8.6 8.9 9.2 8.4"
         stroke="#8cc05a"
         stroke-width="0.35"
         stroke-linecap="round"
         fill="none"
         id="path862" />
    </g>
  </defs>
  <!-- Three trunks per tile at uneven spots -->
  <use
     xlink:href="#a"
     transform="matrix(0.9945219,-0.0731884,0.10452846,0.69634109,25.93938,36.796212)"
