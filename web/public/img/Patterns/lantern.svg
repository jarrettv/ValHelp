<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
  <!-- Map pattern for the "Lantern" alt biome: one repeating tile drawn over
       every cell of its sectors (256-unit tile: spread 2 in biomePatterns.ts).
       One motif (#m, base at 5,12.6) is drawn once and placed by <use>, so
       all are the same size; edit #m to change them all (each <use> adds its own
       tilt/mirror). Shapes stay inside the tile, since it repeats edge to edge.
       First pass from a layout script; move the <use>s freely. -->
  <defs>
    <g id="m">
      <circle cx="5" cy="8" r="6" fill="#ffd24a" fill-opacity="0.4"/>
      <path d="M3.4 3.2 C3.4 1.6 6.6 1.6 6.6 3.2" stroke="#1d1712" stroke-width="0.7" fill="none"/>
      <path d="M2.4 3.4 H7.6 L7 4.6 H3 Z" fill="#3a3530" stroke="#1d1712" stroke-width="0.6" stroke-linejoin="round"/>
      <path d="M3 4.6 H7 V11 H3 Z" fill="#ffb43a" stroke="#1d1712" stroke-width="0.6" stroke-linejoin="round"/>
      <path d="M4.2 5.4 V10.2 M5.8 5.4 V10.2" stroke="#7a4a14" stroke-width="0.4"/>
      <path d="M2.4 11 H7.6 L7.2 12.4 H2.8 Z" fill="#3a3530" stroke="#1d1712" stroke-width="0.6" stroke-linejoin="round"/>
    </g>
  </defs>

  <use xlink:href="#m" transform="translate(68.6 62.1) scale(1.3) rotate(-5 5 12.6)"/>
  <use xlink:href="#m" transform="translate(214.3 86.0) scale(1.3) rotate(-2 5 12.6)"/>
  <use xlink:href="#m" transform="translate(30.6 166.3) scale(1.3) rotate(9 5 12.6)"/>
  <use xlink:href="#m" transform="translate(156.7 221.7) scale(1.3) rotate(-8 5 12.6)"/>
</svg>
