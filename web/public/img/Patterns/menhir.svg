<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
  <!-- Map pattern for the "Menhir" alt biome: one repeating tile drawn over
       every cell of its sectors (256-unit tile: spread 2 in biomePatterns.ts).
       One motif (#m, base at 4.2,18) is drawn once and placed by <use>, so
       all are the same size; edit #m to change them all (each <use> adds its own
       tilt/mirror). Shapes stay inside the tile, since it repeats edge to edge.
       First pass from a layout script; move the <use>s freely. -->
  <defs>
    <g id="m">
      <path d="M1 18 C1.2 12 1.6 6 3 2 C3.8 0.8 5.6 0.9 6.2 2.2 C7 6.4 7.2 12 7.4 18 Z" fill="#8a8e94" stroke="#1d1712" stroke-width="0.6" stroke-linejoin="round"/>
      <path d="M5 2.4 C5.8 6.4 6 12 6.2 18 H7.4 C7.2 12 7 6.4 6.2 2.2 Z" fill="#62666c"/>
      <path d="M2.4 5 C2.8 3.6 3.4 2.6 4.2 2.2" stroke="#b6babf" stroke-width="0.5" stroke-linecap="round" fill="none"/>
      <path d="M2.6 2.6 C3.4 1.6 4.8 1.4 5.8 2.2 C5 2.8 3.6 2.9 2.6 2.6 Z" fill="#6f8f3a"/>
    </g>
  </defs>

  <use xlink:href="#m" transform="translate(168.9 3.8) scale(1.4) translate(8.4 0) scale(-1 1) rotate(-2 4.2 18)"/>
  <use xlink:href="#m" transform="translate(84.4 104.4) scale(1.4) rotate(0 4.2 18)"/>
  <use xlink:href="#m" transform="translate(98.2 110.5) scale(1.4) rotate(6 4.2 18)"/>
  <use xlink:href="#m" transform="translate(197.4 213.9) scale(1.4) translate(8.4 0) scale(-1 1) rotate(6 4.2 18)"/>
</svg>
