<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="128" height="128" viewBox="0 0 128 128">
  <!-- Map pattern for the "Peaceful Meadows" alt biome: one repeating tile drawn over
       every cell of its sectors (128-unit tile: spread 1 in biomePatterns.ts).
       One motif (#m, base at 3,3) is drawn once and placed by <use>, so
       all are the same size; edit #m to change them all (each <use> adds its own
       tilt/mirror). Shapes stay inside the tile, since it repeats edge to edge.
       First pass from a layout script; move the <use>s freely. -->
  <defs>
    <g id="m">
      <circle cx="3" cy="3" r="3" fill="#e6ff7a" fill-opacity="0.35"/>
      <circle cx="3" cy="3" r="1.1" fill="#f6ffb8" stroke="#6a7a1a" stroke-width="0.3"/>
    </g>
  </defs>

  <use xlink:href="#m" transform="translate(113.4 15.0) scale(1.0) translate(6 0) scale(-1 1) rotate(9 3 3)"/>
  <use xlink:href="#m" transform="translate(117.7 19.6) scale(1.0) rotate(9 3 3)"/>
  <use xlink:href="#m" transform="translate(107.4 19.7) scale(1.0) rotate(-1 3 3)"/>
  <use xlink:href="#m" transform="translate(111.6 24.1) scale(1.0) translate(6 0) scale(-1 1) rotate(10 3 3)"/>
  <use xlink:href="#m" transform="translate(40.9 39.4) scale(1.0) rotate(5 3 3)"/>
  <use xlink:href="#m" transform="translate(34.2 42.0) scale(1.0) translate(6 0) scale(-1 1) rotate(-8 3 3)"/>
  <use xlink:href="#m" transform="translate(38.9 46.2) scale(1.0) rotate(8 3 3)"/>
  <use xlink:href="#m" transform="translate(80.2 52.7) scale(1.0) translate(6 0) scale(-1 1) rotate(2 3 3)"/>
  <use xlink:href="#m" transform="translate(94.9 56.2) scale(1.0) translate(6 0) scale(-1 1) rotate(-3 3 3)"/>
  <use xlink:href="#m" transform="translate(88.5 56.4) scale(1.0) rotate(1 3 3)"/>
  <use xlink:href="#m" transform="translate(28.9 76.9) scale(1.0) translate(6 0) scale(-1 1) rotate(-3 3 3)"/>
  <use xlink:href="#m" transform="translate(41.1 78.7) scale(1.0) rotate(2 3 3)"/>
  <use xlink:href="#m" transform="translate(34.8 79.3) scale(1.0) translate(6 0) scale(-1 1) rotate(0 3 3)"/>
  <use xlink:href="#m" transform="translate(86.4 97.3) scale(1.0) translate(6 0) scale(-1 1) rotate(7 3 3)"/>
  <use xlink:href="#m" transform="translate(92.1 98.3) scale(1.0) translate(6 0) scale(-1 1) rotate(-9 3 3)"/>
  <use xlink:href="#m" transform="translate(93.8 103.7) scale(1.0) translate(6 0) scale(-1 1) rotate(9 3 3)"/>
  <use xlink:href="#m" transform="translate(85.5 103.9) scale(1.0) rotate(1 3 3)"/>
  <use xlink:href="#m" transform="translate(26.5 115.0) scale(1.0) rotate(-6 3 3)"/>
  <use xlink:href="#m" transform="translate(18.0 119.5) scale(1.0) translate(6 0) scale(-1 1) rotate(6 3 3)"/>
  <use xlink:href="#m" transform="translate(31.8 120.5) scale(1.0) translate(6 0) scale(-1 1) rotate(5 3 3)"/>
  <use xlink:href="#m" transform="translate(24.7 120.5) scale(1.0) rotate(-4 3 3)"/>
</svg>
