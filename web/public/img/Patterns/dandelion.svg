<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="128" height="128" viewBox="0 0 128 128">
  <!-- Map pattern for the "Dandelion Meadows" alt biome: one repeating tile drawn over
       every cell of its sectors (128-unit tile: spread 1 in biomePatterns.ts).
       One motif (#m, base at 4,14) is drawn once and placed by <use>, so
       all are the same size; edit #m to change them all (each <use> adds its own
       tilt/mirror). Shapes stay inside the tile, since it repeats edge to edge.
       First pass from a layout script; move the <use>s freely. -->
  <defs>
    <g id="m">
      <path d="M4 14 C4.2 11.4 4.6 9 4.2 6.4" stroke="#3f7a2f" stroke-width="0.9" stroke-linecap="round" fill="none"/>
      <path d="M4.1 12.6 C2.6 12.2 1.4 11.2 0.8 9.8 C2.4 10.2 3.4 11 4.1 12.6 Z" fill="#4f8a34" stroke="#1d1712" stroke-width="0.6" stroke-linejoin="round"/>
      <path d="M4.2 11.6 C5.6 11 6.6 10 7.1 8.6 C5.6 9.2 4.7 10.2 4.2 11.6 Z" fill="#4f8a34" stroke="#1d1712" stroke-width="0.6" stroke-linejoin="round"/>
      <circle cx="4.2" cy="4.6" r="2.9" fill="#f2c62a" stroke="#1d1712" stroke-width="0.6" stroke-linejoin="round"/>
      <circle cx="4.2" cy="4.6" r="1.3" fill="#d89a12"/>
      <path d="M2.9 3.1 C3.5 2.5 4.6 2.4 5.3 2.9" stroke="#fbe58a" stroke-width="0.5" stroke-linecap="round" fill="none"/>
    </g>
  </defs>

  <use xlink:href="#m" transform="translate(14.1 32.9) scale(1.0) translate(8 0) scale(-1 1) rotate(-9 4 14)"/>
  <use xlink:href="#m" transform="translate(21.1 36.8) scale(1.0) translate(8 0) scale(-1 1) rotate(-10 4 14)"/>
  <use xlink:href="#m" transform="translate(107.7 50.3) scale(1.0) translate(8 0) scale(-1 1) rotate(4 4 14)"/>
  <use xlink:href="#m" transform="translate(99.2 50.4) scale(1.0) translate(8 0) scale(-1 1) rotate(-0 4 14)"/>
  <use xlink:href="#m" transform="translate(51.8 61.0) scale(1.0) rotate(2 4 14)"/>
  <use xlink:href="#m" transform="translate(62.4 63.7) scale(1.0) rotate(2 4 14)"/>
  <use xlink:href="#m" transform="translate(11.9 83.6) scale(1.0) rotate(4 4 14)"/>
  <use xlink:href="#m" transform="translate(5.6 89.1) scale(1.0) rotate(-10 4 14)"/>
  <use xlink:href="#m" transform="translate(16.5 90.6) scale(1.0) rotate(7 4 14)"/>
</svg>
