  <path fill="#e2f4fb" stroke="#3f7890" stroke-width="8" stroke-linejoin="round"
        d="M 0 432 L 0 390 L 40 372 L 74 386 L 120 354 L 152 380 L 200 366 L 240 350 L 272 374 L 318 360 L 352 380 L 404 348 L 440 372 L 478 356 L 512 374 L 512 432 Z"/>
  <!-- Shaded facets under three of the peaks -->
  <path fill="#9fd0e4" d="M 120 354 L 152 380 L 128 418 Z"/>
  <path fill="#9fd0e4" d="M 240 350 L 272 374 L 250 408 Z"/>
  <path fill="#9fd0e4" d="M 404 348 L 440 372 L 414 404 Z"/>
  <!-- Ice shards pushed up against the hull -->
  <path fill="#eef9fd" stroke="#3f7890" stroke-width="7" stroke-linejoin="round" d="M 150 382 L 174 300 L 198 372 Z"/>
  <path fill="#eef9fd" stroke="#3f7890" stroke-width="7" stroke-linejoin="round" d="M 350 382 L 372 316 L 394 368 Z"/>
  <!-- Cracks -->
  <path fill="none" stroke="#5a9ab4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M 62 396 L 84 414 L 80 426"/>
  <path fill="none" stroke="#5a9ab4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M 330 396 L 350 416 L 374 424"/>
</svg>
