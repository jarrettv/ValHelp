  <path fill="currentColor" d="M 231 124 C 224.71 145.5 221.63 166.8 220.1 186.4 L 230.6 205.9 L 129.6 255.2 C 129.4 262.94 155.2 255.8 155.1 262.52 L 239.9 223.12 L 240 223.3 L 276 207.5 L 275.95 207.42 L 377.95 163.02 L 370.12 145.12 L 267.12 190.22 Z"/>
