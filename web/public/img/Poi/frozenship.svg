  <path fill="currentColor" d="M 64 171.7 C 44.6 225.2 35.4 271.2 20.2 332.7 C 20.66 338.7 12.95 352.5 23.37 351.9 C 32.62 346.94 43.57 344.46 53.97 346.87 C 73.57 348.67 94.57 356.73 104.77 374.57 C 108.31 379.83 115.57 381.5 122.87 382.12 C 131.1 384.32 134.67 373.04 133.57 364.42 C 130.85 353.22 213.17 341.22 208.27 330.72 C 196.27 308.32 152.37 323.21 141.27 300.42 C 121.07 358.62 70.27 200.42 64.07 171.42 Z"/>
  <!-- Stern half of the hull (right) -->
  <path fill="currentColor" d="M 426 176.96 C 377.6 239.96 332.1 305.96 226 362.96 L 230.37 366.44 C 241.27 375.14 250.47 381.74 259.07 381.74 S 276.87 375.17 287.77 366.44 C 298.67 357.74 311.37 346.94 328.67 346.94 S 358.67 357.74 369.57 366.44 S 389.67 381.74 398.27 381.74 Q 400.03 381.74 401.84 381.37 Q 404.67 369.39 407.15 357.37 L 386.65 322.97 L 406.55 308.47 L 388.25 291.67 L 420.35 272.47 C 423.73 240.67 425.59 209.07 426.47 177.27 Z"/>
  <!-- Stern post (far right) -->
  <path fill="currentColor" d="M 445.2 187.76 C 443.16 247.46 437.52 306.76 424.5 367.76 L 426.6 366.11 C 435.88 358.71 446.4 349.81 460 347.31 L 467.72 342.47 Q 467.82 335.29 467.85 328.17 L 452.65 324.92 S 459.87 307.02 467.05 290.02 C 465.21 254.12 459.67 219.52 445.15 188.02 Z"/>
  <!-- Sail scrap caught on the boom -->
  <path fill="currentColor" d="M 285.2 224.86 L 249.2 240.66 L 282.8 303.06 C 293.4 295.01 303.7 286.46 313.5 277.56 Z"/>
