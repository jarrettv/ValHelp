# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - valhelp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # The character tracker (character/Vh.Tracker): a NativeAOT Windows exe, so it
  # builds on Windows; the site serves it at /downloads/ValHelpTracker.exe.
  tracker:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish tracker (NativeAOT)
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files (x86)\Microsoft Visual Studio\Installer;$env:PATH"
          dotnet publish character/Vh.Tracker -c Release -o tracker-out

      - name: Upload tracker
        uses: actions/upload-artifact@v4
        with:
          name: tracker
          path: tracker-out/ValHelpTracker.exe

  build:
    runs-on: ubuntu-latest
    needs: tracker
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install npm dependencies
        run: |
          cd web
          npm install

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Browser worldgen (seedgen/Vh.WorldGen.Wasm, AOT-compiled) into web/public/worldgen/,
      # which the web build copies into the site. Its output is gitignored, so it's built here.
      - name: Build browser worldgen (WebAssembly)
        run: |
          dotnet workload install wasm-tools-net9
          bash scripts/build_worldgen_wasm.sh

      - name: Build with npm
        run: |
          cd web
          mkdir -p ../api/wwwroot
          npm run build
          cp -r dist/* ../api/wwwroot/

      - name: Add the tracker download
        uses: actions/download-artifact@v4
        with:
          name: tracker
          path: api/wwwroot/downloads

      - name: Build with dotnet
        run: dotnet build api/ValHelpApi.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish api/ValHelpApi.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_966B9118B3FC47E4AF3117BD1652D131 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_72A4417D23234231A649117CD13EF489 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CF01EB49EBFE4E89BE40BA1B3AFF9132 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'valhelp'
          slot-name: 'Production'
          package: .
          